<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #10161B;
    --panel: #17211F;
    --panel-2: #1D2B27;
    --bone: #EDEAE0;
    --bone-dim: #B9C0BA;
    --trail: #E2703A;
    --trail-dim: #7A3D22;
    --sage: #8CA084;
    --line: #2B3733;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(140,160,132,0.06) 0, transparent 40%),
      repeating-radial-gradient(circle at 80% 60%, transparent 0, transparent 38px, rgba(226,112,58,0.035) 39px, transparent 40px);
  }
  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 28px;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .cart-toggle {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .cart-toggle:hover { border-color: var(--trail-dim); }
  .cart-toggle .cart-icon { font-size: 16px; }
  .cart-badge {
    position: absolute;
    top: -7px;
    right: -7px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 9px;
    background: var(--trail);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .cart-badge.hidden { display: none; }
  .wordmark {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--bone);
  }
  .wordmark span { color: var(--trail); }
  .coords {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--sage);
    letter-spacing: 1px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 24px;
  }
  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--trail);
    margin: 0 0 10px;
  }
  h2 {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 26px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 16px;
  }
  .catalog {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 16px;
    position: relative;
    transition: border-color 0.15s ease;
  }
  .card:hover { border-color: var(--trail-dim); }
  .card .icon {
    font-size: 26px;
    margin-bottom: 10px;
    display: block;
  }
  .card .name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .card .desc {
    font-size: 12px;
    color: var(--bone-dim);
    line-height: 1.5;
    margin-bottom: 12px;
    min-height: 36px;
  }
  .card .price-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card .price {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--trail);
  }
  .card .sku {
    position: absolute;
    top: 14px;
    right: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--bone-dim);
    opacity: 0.6;
  }
  .card .add-btn {
    background: transparent;
    color: var(--trail);
    border: 1px solid var(--trail-dim);
    border-radius: 2px;
    padding: 6px 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .card .add-btn:hover {
    background: var(--trail);
    color: var(--ink);
  }
  .card .add-btn.added {
    background: var(--sage);
    color: var(--ink);
    border-color: var(--sage);
  }
  .chat-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    display: flex;
    flex-direction: column;
    height: 560px;
  }
  .chat-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--sage);
    box-shadow: 0 0 0 3px rgba(140,160,132,0.15);
  }
  .chat-header .title {
    font-weight: 600;
    font-size: 13px;
  }
  .chat-header .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--bone-dim);
    margin-left: auto;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 84%;
    padding: 10px 13px;
    border-radius: 2px;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .msg.assistant {
    background: var(--panel-2);
    border-left: 2px solid var(--sage);
    align-self: flex-start;
  }
  .msg.user {
    background: rgba(226,112,58,0.1);
    border-right: 2px solid var(--trail);
    align-self: flex-end;
    text-align: right;
  }
  .msg.typing {
    color: var(--bone-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
  }
  .composer {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--line);
  }
  .composer input {
    flex: 1;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--bone);
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
  }
  .composer input:focus { border-color: var(--trail-dim); }
  .composer button {
    background: var(--trail);
    color: var(--ink);
    border: none;
    border-radius: 2px;
    padding: 0 18px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .composer button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .suggestions {
    display: flex;
    gap: 6px;
    padding: 0 14px 14px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 11px;
    color: var(--sage);
    border: 1px solid var(--line);
    padding: 5px 10px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }
  .chip:hover { border-color: var(--sage); }

  .cart-overlay {
    position: fixed;
    inset: 0;
    background: rgba(16,22,27,0.7);
    display: flex;
    justify-content: flex-end;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .cart-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .cart-panel {
    width: 380px;
    max-width: 92vw;
    height: 100%;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.2s ease;
  }
  .cart-overlay.open .cart-panel {
    transform: translateX(0);
  }
  .cart-header {
    padding: 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cart-header .title {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .cart-close {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--bone-dim);
    border-radius: 2px;
    width: 28px;
    height: 28px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .cart-close:hover { border-color: var(--trail-dim); color: var(--bone); }
  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 8px 18px;
  }
  .cart-empty {
    color: var(--bone-dim);
    font-size: 13px;
    padding: 24px 0;
    text-align: center;
  }
  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .cart-item .icon {
    font-size: 20px;
    width: 28px;
    text-align: center;
    flex-shrink: 0;
  }
  .cart-item .info {
    flex: 1;
    min-width: 0;
  }
  .cart-item .name {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 3px;
  }
  .cart-item .unit-price {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--bone-dim);
  }
  .cart-item .qty-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .cart-item .qty-btn {
    width: 22px;
    height: 22px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--bone);
    border-radius: 2px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cart-item .qty-btn:hover { border-color: var(--trail-dim); }
  .cart-item .qty-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    min-width: 16px;
    text-align: center;
  }
  .cart-item .line-total {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--trail);
    min-width: 52px;
    text-align: right;
    flex-shrink: 0;
  }
  .cart-footer {
    padding: 16px 18px 20px;
    border-top: 1px solid var(--line);
  }
  .cart-total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .cart-total-row .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--bone-dim);
  }
  .cart-total-row .value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    color: var(--trail);
  }
  .cart-checkout {
    width: 100%;
    background: var(--trail);
    color: var(--ink);
    border: none;
    border-radius: 2px;
    padding: 12px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .cart-checkout:disabled {
    opacity: 0.5;
    cursor: default;
  }
</style>

<div class="app">
  <div class="topbar">
    <div class="wordmark">FERNWEH<span>.</span>OUTDOOR</div>
    <div class="topbar-right">
      <div class="coords">47.27&deg;N &mdash; 11.39&deg;E &mdash; DEMO BUILD</div>
      <button class="cart-toggle" id="cartToggle" aria-label="Warenkorb &ouml;ffnen">
        <span class="cart-icon">&#128722;</span>
        <span class="cart-badge hidden" id="cartBadge">0</span>
      </button>
    </div>
  </div>

  <div class="grid">
    <div>
      <p class="eyebrow">Aktueller Bestand</p>
      <h2>Trail &amp; Basislager</h2>
      <div class="catalog" id="catalog"></div>
    </div>

    <div>
      <p class="eyebrow">Live-Demo</p>
      <h2>Frag den Guide</h2>
      <div class="chat-panel">
        <div class="chat-header">
          <div class="dot"></div>
          <div class="title">Fernweh Guide</div>
          <div class="sub">powered by Claude</div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="suggestions" id="suggestions"></div>
        <div class="composer">
          <input id="input" type="text" placeholder="z.B. Was brauche ich f&uuml;r ein Wochenende im Herbst?" />
          <button id="send">Senden</button>
        </div>
      </div>
    </div>
  </div>

  <div class="cart-overlay" id="cartOverlay">
    <div class="cart-panel">
      <div class="cart-header">
        <div class="title">Warenkorb</div>
        <button class="cart-close" id="cartClose" aria-label="Warenkorb schlie&szlig;en">&times;</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span class="label">Gesamtsumme</span>
          <span class="value" id="cartTotal">&euro;0</span>
        </div>
        <button class="cart-checkout" id="cartCheckout" disabled>Zur Kasse (Demo)</button>
      </div>
    </div>
  </div>
</div>

<script>
  const PRODUCTS = [
    { sku: "FW-TT-04", icon: "\u26fa", name: "Kamm 2P Zelt", desc: "Freistehendes 2-Personen-Zelt, 1.9kg, 3-Jahreszeiten.", price: "€289", priceNum: 289 },
    { sku: "FW-RS-11", icon: "\u{1f392}", name: "Grat 38 Rucksack", desc: "38L Tagesrucksack mit belüftetem Tragesystem.", price: "€145", priceNum: 145 },
    { sku: "FW-SB-07", icon: "\u2744\ufe0f", name: "Nachtfrost Schlafsack", desc: "Daunenschlafsack, Komfortbereich bis -5°C.", price: "€219", priceNum: 219 },
    { sku: "FW-HL-02", icon: "\u{1f526}", name: "Polarlicht Stirnlampe", desc: "350 Lumen, USB-C, 40h Akkulaufzeit.", price: "€39", priceNum: 39 },
    { sku: "FW-WF-09", icon: "\u{1f4a7}", name: "Quellwasser Filter", desc: "Kompakter Wasserfilter, 0.1 Mikron, 650ml/min.", price: "€54", priceNum: 54 },
    { sku: "FW-BT-15", icon: "\u{1f97e}", name: "Gratwanderer Boots", desc: "Wasserdichte Wanderschuhe, Vibram-Sohle.", price: "€169", priceNum: 169 }
  ];

  const catalogEl = document.getElementById('catalog');
  PRODUCTS.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="sku">${p.sku}</div>
      <span class="icon">${p.icon}</span>
      <div class="name">${p.name}</div>
      <div class="desc">${p.desc}</div>
      <div class="price-row">
        <div class="price">${p.price}</div>
        <button class="add-btn" data-sku="${p.sku}">In den Warenkorb</button>
      </div>
    `;
    catalogEl.appendChild(card);
  });

  // --- Warenkorb ---
  const cart = {}; // sku -> qty
  const cartToggle = document.getElementById('cartToggle');
  const cartOverlay = document.getElementById('cartOverlay');
  const cartClose = document.getElementById('cartClose');
  const cartItemsEl = document.getElementById('cartItems');
  const cartBadge = document.getElementById('cartBadge');
  const cartTotalEl = document.getElementById('cartTotal');
  const cartCheckout = document.getElementById('cartCheckout');

  function cartCount() {
    return Object.values(cart).reduce((sum, qty) => sum + qty, 0);
  }

  function cartTotal() {
    return Object.entries(cart).reduce((sum, [sku, qty]) => {
      const product = PRODUCTS.find(p => p.sku === sku);
      return sum + (product ? product.priceNum * qty : 0);
    }, 0);
  }

  function setQty(sku, qty) {
    if (qty <= 0) {
      delete cart[sku];
    } else {
      cart[sku] = qty;
    }
    renderCart();
  }

  function renderCart() {
    const count = cartCount();
    cartBadge.textContent = count;
    cartBadge.classList.toggle('hidden', count === 0);
    cartTotalEl.textContent = `€${cartTotal()}`;
    cartCheckout.disabled = count === 0;

    cartItemsEl.innerHTML = '';
    const entries = Object.entries(cart);
    if (entries.length === 0) {
      cartItemsEl.innerHTML = '<div class="cart-empty">Dein Warenkorb ist leer.</div>';
      return;
    }
    entries.forEach(([sku, qty]) => {
      const product = PRODUCTS.find(p => p.sku === sku);
      if (!product) return;
      const item = document.createElement('div');
      item.className = 'cart-item';
      item.innerHTML = `
        <span class="icon">${product.icon}</span>
        <div class="info">
          <div class="name">${product.name}</div>
          <div class="unit-price">${product.price} / St&uuml;ck</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn" data-action="dec" data-sku="${sku}">&minus;</button>
          <span class="qty-value">${qty}</span>
          <button class="qty-btn" data-action="inc" data-sku="${sku}">+</button>
        </div>
        <div class="line-total">€${product.priceNum * qty}</div>
      `;
      cartItemsEl.appendChild(item);
    });
  }

  catalogEl.addEventListener('click', e => {
    const btn = e.target.closest('.add-btn');
    if (!btn) return;
    const sku = btn.dataset.sku;
    setQty(sku, (cart[sku] || 0) + 1);
    btn.classList.add('added');
    btn.textContent = 'Hinzugefügt ✓';
    setTimeout(() => {
      btn.classList.remove('added');
      btn.textContent = 'In den Warenkorb';
    }, 900);
  });

  cartItemsEl.addEventListener('click', e => {
    const btn = e.target.closest('.qty-btn');
    if (!btn) return;
    const sku = btn.dataset.sku;
    const delta = btn.dataset.action === 'inc' ? 1 : -1;
    setQty(sku, (cart[sku] || 0) + delta);
  });

  function openCart() { cartOverlay.classList.add('open'); }
  function closeCart() { cartOverlay.classList.remove('open'); }

  cartToggle.addEventListener('click', openCart);
  cartClose.addEventListener('click', closeCart);
  cartOverlay.addEventListener('click', e => {
    if (e.target === cartOverlay) closeCart();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeCart();
  });

  renderCart();

  const SYSTEM_PROMPT = `Du bist der "Fernweh Guide", der KI-Einkaufsberater von Fernweh Outdoor, einem Online-Shop für Wander- und Trekkingausrüstung.

Sortiment (nur diese Produkte empfehlen, mit exaktem Namen und Preis):
${PRODUCTS.map(p => `- ${p.name} (${p.sku}) – ${p.price}: ${p.desc}`).join('\n')}

Verhalten:
- Antworte auf Deutsch, freundlich, kompetent, in 2-4 kurzen Sätzen.
- Empfehle konkrete Produkte aus dem Sortiment mit Preis, wenn passend.
- Stelle bei Bedarf eine kurze Rückfrage (z.B. Jahreszeit, Personenzahl, Budget), bevor du empfiehlst.
- Erfinde keine Produkte oder Preise außerhalb der Liste.
- Bleibe immer im Kontext von Outdoor-/Trekkingausrüstung.`;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const suggestionsEl = document.getElementById('suggestions');

  let history = [];

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function setSuggestions(list) {
    suggestionsEl.innerHTML = '';
    list.forEach(s => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = s;
      chip.onclick = () => { inputEl.value = s; sendMessage(); };
      suggestionsEl.appendChild(chip);
    });
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    sendBtn.disabled = true;
    suggestionsEl.innerHTML = '';

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    const typing = addMessage('assistant typing', 'Guide tippt…');

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: history
        })
      });
      const data = await response.json();
      const reply = (data.content || [])
        .map(b => b.text || '')
        .filter(Boolean)
        .join('\n') || 'Entschuldigung, da ist etwas schiefgelaufen. Magst du es nochmal versuchen?';

      typing.remove();
      addMessage('assistant', reply);
      history.push({ role: 'assistant', content: reply });
    } catch (err) {
      typing.remove();
      addMessage('assistant', 'Verbindung fehlgeschlagen. Bitte nochmal versuchen.');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  addMessage('assistant', 'Servus! Ich bin der Fernweh Guide. Plant ihr eine Wanderung, eine Übernachtung im Zelt oder sucht ihr etwas Bestimmtes? Ich helfe gern bei der Ausrüstung.');
  setSuggestions([
    'Was brauche ich für 3 Tage Trekking im Herbst?',
    'Zelt für 2 Personen unter 300€?',
    'Was ist eure leichteste Ausrüstung?'
  ]);
</script>
