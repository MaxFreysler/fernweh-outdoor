<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #10161B;
    --panel: #17211F;
    --panel-2: #1D2B27;
    --bone: #EDEAE0;
    --bone-dim: #B9C0BA;
    --trail: #E2703A;
    --trail-dim: #7A3D22;
    --sage: #8CA084;
    --line: #2B3733;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(140,160,132,0.06) 0, transparent 40%),
      repeating-radial-gradient(circle at 80% 60%, transparent 0, transparent 38px, rgba(226,112,58,0.035) 39px, transparent 40px);
  }
  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 28px;
  }
  .wordmark {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--bone);
  }
  .wordmark span { color: var(--trail); }
  .coords {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--sage);
    letter-spacing: 1px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 24px;
  }
  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--trail);
    margin: 0 0 10px;
  }
  h2 {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 26px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 16px;
  }
  .catalog {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 16px;
    position: relative;
    transition: border-color 0.15s ease;
  }
  .card:hover { border-color: var(--trail-dim); }
  .card .icon {
    font-size: 26px;
    margin-bottom: 10px;
    display: block;
  }
  .card .name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .card .desc {
    font-size: 12px;
    color: var(--bone-dim);
    line-height: 1.5;
    margin-bottom: 12px;
    min-height: 36px;
  }
  .card .price {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--trail);
  }
  .card .sku {
    position: absolute;
    top: 14px;
    right: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--bone-dim);
    opacity: 0.6;
  }
  .chat-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    display: flex;
    flex-direction: column;
    height: 560px;
  }
  .chat-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--sage);
    box-shadow: 0 0 0 3px rgba(140,160,132,0.15);
  }
  .chat-header .title {
    font-weight: 600;
    font-size: 13px;
  }
  .chat-header .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--bone-dim);
    margin-left: auto;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 84%;
    padding: 10px 13px;
    border-radius: 2px;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .msg.assistant {
    background: var(--panel-2);
    border-left: 2px solid var(--sage);
    align-self: flex-start;
  }
  .msg.user {
    background: rgba(226,112,58,0.1);
    border-right: 2px solid var(--trail);
    align-self: flex-end;
    text-align: right;
  }
  .msg.typing {
    color: var(--bone-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
  }
  .composer {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--line);
  }
  .composer input {
    flex: 1;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--bone);
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
  }
  .composer input:focus { border-color: var(--trail-dim); }
  .composer button {
    background: var(--trail);
    color: var(--ink);
    border: none;
    border-radius: 2px;
    padding: 0 18px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .composer button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .suggestions {
    display: flex;
    gap: 6px;
    padding: 0 14px 14px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 11px;
    color: var(--sage);
    border: 1px solid var(--line);
    padding: 5px 10px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }
  .chip:hover { border-color: var(--sage); }
</style>

<div class="app">
  <div class="topbar">
    <div class="wordmark">FERNWEH<span>.</span>OUTDOOR</div>
    <div class="coords">47.27&deg;N &mdash; 11.39&deg;E &mdash; DEMO BUILD</div>
  </div>

  <div class="grid">
    <div>
      <p class="eyebrow">Aktueller Bestand</p>
      <h2>Trail &amp; Basislager</h2>
      <div class="catalog" id="catalog"></div>
    </div>

    <div>
      <p class="eyebrow">Live-Demo</p>
      <h2>Frag den Guide</h2>
      <div class="chat-panel">
        <div class="chat-header">
          <div class="dot"></div>
          <div class="title">Fernweh Guide</div>
          <div class="sub">powered by Claude</div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="suggestions" id="suggestions"></div>
        <div class="composer">
          <input id="input" type="text" placeholder="z.B. Was brauche ich f&uuml;r ein Wochenende im Herbst?" />
          <button id="send">Senden</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const PRODUCTS = [
    { sku: "FW-TT-04", icon: "\u26fa", name: "Kamm 2P Zelt", desc: "Freistehendes 2-Personen-Zelt, 1.9kg, 3-Jahreszeiten.", price: "€289" },
    { sku: "FW-RS-11", icon: "\u{1f392}", name: "Grat 38 Rucksack", desc: "38L Tagesrucksack mit belüftetem Tragesystem.", price: "€145" },
    { sku: "FW-SB-07", icon: "\u2744\ufe0f", name: "Nachtfrost Schlafsack", desc: "Daunenschlafsack, Komfortbereich bis -5°C.", price: "€219" },
    { sku: "FW-HL-02", icon: "\u{1f526}", name: "Polarlicht Stirnlampe", desc: "350 Lumen, USB-C, 40h Akkulaufzeit.", price: "€39" },
    { sku: "FW-WF-09", icon: "\u{1f4a7}", name: "Quellwasser Filter", desc: "Kompakter Wasserfilter, 0.1 Mikron, 650ml/min.", price: "€54" },
    { sku: "FW-BT-15", icon: "\u{1f97e}", name: "Gratwanderer Boots", desc: "Wasserdichte Wanderschuhe, Vibram-Sohle.", price: "€169" }
  ];

  const catalogEl = document.getElementById('catalog');
  PRODUCTS.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="sku">${p.sku}</div>
      <span class="icon">${p.icon}</span>
      <div class="name">${p.name}</div>
      <div class="desc">${p.desc}</div>
      <div class="price">${p.price}</div>
    `;
    catalogEl.appendChild(card);
  });

  const SYSTEM_PROMPT = `Du bist der "Fernweh Guide", der KI-Einkaufsberater von Fernweh Outdoor, einem Online-Shop für Wander- und Trekkingausrüstung.

Sortiment (nur diese Produkte empfehlen, mit exaktem Namen und Preis):
${PRODUCTS.map(p => `- ${p.name} (${p.sku}) – ${p.price}: ${p.desc}`).join('\n')}

Verhalten:
- Antworte auf Deutsch, freundlich, kompetent, in 2-4 kurzen Sätzen.
- Empfehle konkrete Produkte aus dem Sortiment mit Preis, wenn passend.
- Stelle bei Bedarf eine kurze Rückfrage (z.B. Jahreszeit, Personenzahl, Budget), bevor du empfiehlst.
- Erfinde keine Produkte oder Preise außerhalb der Liste.
- Bleibe immer im Kontext von Outdoor-/Trekkingausrüstung.`;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const suggestionsEl = document.getElementById('suggestions');

  let history = [];

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function setSuggestions(list) {
    suggestionsEl.innerHTML = '';
    list.forEach(s => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = s;
      chip.onclick = () => { inputEl.value = s; sendMessage(); };
      suggestionsEl.appendChild(chip);
    });
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    sendBtn.disabled = true;
    suggestionsEl.innerHTML = '';

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    const typing = addMessage('assistant typing', 'Guide tippt…');

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: history
        })
      });
      const data = await response.json();
      const reply = (data.content || [])
        .map(b => b.text || '')
        .filter(Boolean)
        .join('\n') || 'Entschuldigung, da ist etwas schiefgelaufen. Magst du es nochmal versuchen?';

      typing.remove();
      addMessage('assistant', reply);
      history.push({ role: 'assistant', content: reply });
    } catch (err) {
      typing.remove();
      addMessage('assistant', 'Verbindung fehlgeschlagen. Bitte nochmal versuchen.');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  addMessage('assistant', 'Servus! Ich bin der Fernweh Guide. Plant ihr eine Wanderung, eine Übernachtung im Zelt oder sucht ihr etwas Bestimmtes? Ich helfe gern bei der Ausrüstung.');
  setSuggestions([
    'Was brauche ich für 3 Tage Trekking im Herbst?',
    'Zelt für 2 Personen unter 300€?',
    'Was ist eure leichteste Ausrüstung?'
  ]);
</script>
